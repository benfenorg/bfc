[package]
name = "sui-bridge"
version.workspace = true
authors = ["Mysten Labs <build@mystenlabs.com>"]
license = "Apache-2.0"
publish = false
edition = "2021"

[dependencies]
ethers = "2.0"
diesel = { workspace = true, features = ["serde_json"] }
diesel-async = { workspace = true, features = ["bb8", "postgres"] }
chrono.workspace = true
tokio = { workspace = true, features = ["full"] }
sui-types.workspace = true
sui-authority-aggregation.workspace = true
arc-swap.workspace = true
strum_macros.workspace = true
num_enum.workspace = true
move-core-types.workspace = true
url.workspace = true
futures.workspace = true
once_cell.workspace = true
telemetry-subscribers.workspace = true
prometheus.workspace = true
async-trait.workspace = true
typed-store.workspace = true
mysten-metrics.workspace = true
sui-sdk.workspace = true
sui-keys.workspace = true
sui-config.workspace = true
clap.workspace = true
tracing.workspace = true
bin-version.workspace = true
bcs.workspace = true
sui-json-rpc-types.workspace = true
serde.workspace = true
serde_with.workspace = true
serde_json.workspace = true
eyre.workspace = true
tempfile.workspace = true
axum.workspace = true
anyhow.workspace = true
reqwest.workspace = true
fastcrypto.workspace = true
tap.workspace = true
rand.workspace = true
lru.workspace = true
shared-crypto.workspace = true
backoff.workspace = true
mysten-common.workspace = true
enum_dispatch.workspace = true
sui-json-rpc-api.workspace = true
jsonrpsee.workspace = true
sui-test-transaction-builder.workspace = true
hex-literal = { version = "0.3.4", optional = true }
test-cluster = { workspace = true, optional = true }
bs58 = "0.4.0"
hex = "0.4.3"
sha2 = "0.10.2"
anchor-client = { version = "0.32.1", features = ["async"] }
anchor-lang = "0.32.1"
bytemuck = { version = "1.20.0", features = ["min_const_generics"] }
solana-client = "=2.3.13"
solana-sdk = "=2.3.1"
solana-program = "3.0.0"
spl-token = "5.0.0"
spl-associated-token-account = "4.0.0"
solana-program-pack="2.2.1"

[dev-dependencies]
sui-config.workspace = true
sui-test-transaction-builder.workspace = true
maplit = "1.0.2"
tracing-test = "0.2"


[features]
test-utils = ["hex-literal", "test-cluster"]
default = ["test-utils"]